[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "SIM", "RET", "PIE", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913", "PLR0914", "RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["PLR2004", "DTZ001"]
